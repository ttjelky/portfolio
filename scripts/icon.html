<!doctype html>
<!-- Іконка сайту (знак «OB», як у навігації). Параметри: ?size=512&scale=1 -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter Tight';
        src: url('../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      html, body { margin: 0; }
      body {
        width: var(--size); height: var(--size);
        display: grid; place-items: center;
        background: #0b0b0b; font-family: 'Inter Tight', sans-serif;
      }
      .mark {
        display: grid; place-items: center;
        width: calc(var(--size) * 0.72 * var(--scale)); aspect-ratio: 1; border-radius: 50%;
        background: #f3f2ee; color: #0b0b0b;
        font-size: calc(var(--size) * 0.3 * var(--scale)); font-weight: 700; letter-spacing: -0.04em;
        padding-right: 0.02em; box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="mark">OB</div>
    <script>
      const p = new URLSearchParams(location.search);
      document.body.style.setProperty('--size', `${p.get('size') ?? 512}px`);
      document.body.style.setProperty('--scale', p.get('scale') ?? 1);
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
</html>
